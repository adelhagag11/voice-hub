<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Hub Admin</title><style>
body{font-family:Arial;background:#0c1020;color:#fff;margin:0;padding:20px}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#151a30;border:1px solid #2b3455;border-radius:15px;padding:16px}table{width:100%;border-collapse:collapse;margin-top:15px;background:#151a30}th,td{padding:10px;border-bottom:1px solid #2b3455;text-align:right}small{color:#9da4c2}</style></head><body>
<h1>🛡️ لوحة تحكم Voice Hub</h1><div class="grid" id="stats"></div><div class="card"><h2>المستخدمون</h2><table><thead><tr><th>الاسم</th><th>Coins</th><th>مرسل</th><th>مستلم</th><th>الغرفة</th></tr></thead><tbody id="users"></tbody></table></div>
<div class="card"><h2>آخر عمليات الهدايا</h2><table><thead><tr><th>من</th><th>إلى</th><th>الهدية</th><th>القيمة</th><th>التاريخ</th></tr></thead><tbody id="tx"></tbody></table></div>
<script>
const giftNames={heart:"❤️ قلب",rose:"🌹 وردة",diamond:"💎 ألماسة",cake:"🎂 كعكة",crown:"👑 تاج",rocket:"🚀 صاروخ",vip:"💰 VIP"};
async function load(){const key=prompt("أدخل مفتاح لوحة الإدارة التجريبي:"); if(!key)return; const d=await fetch("/api/admin/summary?key="+encodeURIComponent(key)).then(r=>r.json());stats.innerHTML=`<div class=card>👤 المستخدمون<br><b>${d.users.length}</b></div><div class=card>🎙️ الغرف<br><b>${d.rooms.length}</b></div><div class=card>🎁 العمليات<br><b>${d.transactions.length}</b></div>`;users.innerHTML=d.users.map(u=>`<tr><td>${u.name}</td><td>🪙 ${u.coins.toLocaleString()}</td><td>${u.sent.toLocaleString()}</td><td>${u.received.toLocaleString()}</td><td>${u.roomId||"-"}</td></tr>`).join("");tx.innerHTML=d.transactions.map(t=>`<tr><td>${t.fromId}</td><td>${t.toId}</td><td>${giftNames[t.giftId]||t.giftId}</td><td>${t.amount.toLocaleString()}</td><td>${new Date(t.createdAt).toLocaleString("ar-EG")}</td></tr>`).join("")}load();setInterval(load,5000)
</script></body></html>
