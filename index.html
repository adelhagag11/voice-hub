<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Hub</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header><div><b>🎙️ VOICE HUB</b><small>غرف صوتية • كوينز • هدايا</small></div><div class="balance">🪙 <span id="coins">0</span></div></header>
<section id="login" class="card"><h2>إنشاء حساب</h2><input id="name" placeholder="اسمك"><button onclick="login()">دخول</button></section>
<section id="home" class="hidden"><div class="card"><h2>الغرف</h2><div id="rooms"></div></div></section>
<section id="room" class="hidden"><div class="card"><div class="top"><h2 id="roomName"></h2><button onclick="leave()">خروج</button></div>
<div id="members" class="members"></div><div class="voice">🎙️<p>الصوت المباشر عبر WebRTC</p><button id="mic" onclick="toggleMic()">🎤 تشغيل الميكروفون</button></div>
<h3>🎁 الهدايا</h3><div id="gifts" class="gifts"></div><h3>💬 الدردشة</h3><div id="chat" class="chat"></div><div class="send"><input id="msg" placeholder="اكتب رسالة"><button onclick="chat()">إرسال</button></div></div></section>
</div><script src="app.js"></script></body></html>
